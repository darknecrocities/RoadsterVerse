name: THRUST//WEIGHT CI Pipeline

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test & 500-Line Guardrail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce 500-Line Source File Policy
        run: python3 scripts/check_source_line_limits.py --path .

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Automated Unit & Integration Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build
